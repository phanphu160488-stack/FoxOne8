services:
  - type: web
    name: vankhanh-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120 --keep-alive 5
    envVars:
      - key: SECRET_KEY
        value: server_vkhanh_2026_stable_secret_key_do_not_change
      # ---- Bot Telegram (tùy chỉnh ở đây hoặc config.py) ----
      - key: TELEGRAM_BOT_TOKEN
        value: "8605090305:AAGMxGBN8dHw3Txi4F8K0Z4WsuBD2ETPBFs"
      - key: TELEGRAM_ADMIN_ID
        value: "8401914033"
      # ---- Admin panel (tùy chỉnh) ----
      - key: ADMIN_USER
        value: "phedevdzz"
      - key: ADMIN_PASS
        value: "x$f%^R4tGF4&nTyD5LW8Avlf"
      # ---- SQLite: dữ liệu lưu trong file server.db ----
      # Nếu muốn dữ liệu tồn tại sau mỗi lần deploy, gắn persistent disk
      # (mount vào /data) — app tự động dùng /data khi thư mục tồn tại.
      - key: SQLITE_DB
        value: "/data/server.db"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
